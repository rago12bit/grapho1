<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 486" width="1280" height="486" role="img" aria-label="How one incident flows through Hypocenter"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ffb347"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c7c88"/></marker></defs><rect width="1280" height="486" rx="16" fill="#0b0b0e"/><rect x="1" y="1" width="1278" height="484" rx="15" fill="none" stroke="#26262d"/><text x="34" y="46" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5">How one incident flows</text><text x="34" y="72" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7c7c88">Every step reads and writes the same FalkorDB graph. Nothing passes between the agents in code.</text><rect x="34" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#26262d"/><text x="50" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">1</text><text x="50" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Alerts arrive</text><text x="50" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">Alertmanager and CI</text><text x="50" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">webhooks write alerts</text><text x="50" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">and changes into the</text><text x="50" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">graph; an incident opens</text><text x="50" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">webhooks · MERGE</text><line x1="224" y1="199" x2="235" y2="199" stroke="#7c7c88" stroke-width="2" marker-end="url(#a)"/><rect x="237" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="253" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">2</text><text x="253" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Trace</text><text x="253" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">walk down from the</text><text x="253" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">symptom; score every</text><text x="253" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">change by the alert</text><text x="253" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">chain climbing back up</text><text x="253" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">algo.BFS · algo.SSpaths</text><line x1="427" y1="199" x2="438" y2="199" stroke="#7c7c88" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#26262d"/><text x="456" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">3</text><text x="456" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Argue</text><text x="456" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">hypotheses with evidence</text><text x="456" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">for and against; a</text><text x="456" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">skeptic tries to knock</text><text x="456" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">the leader over</text><text x="456" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">algo.WCC · algo.MSF</text><line x1="630" y1="199" x2="641" y2="199" stroke="#7c7c88" stroke-width="2" marker-end="url(#a)"/><rect x="643" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="659" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">4</text><text x="659" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Prove</text><text x="659" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">apply the fix to a copy</text><text x="659" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">of the graph: which</text><text x="659" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">alerts it clears, which</text><text x="659" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">it leaves</text><text x="659" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">GRAPH.COPY</text><line x1="833" y1="199" x2="844" y2="199" stroke="#7c7c88" stroke-width="2" marker-end="url(#a)"/><rect x="846" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#26262d"/><text x="862" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">5</text><text x="862" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Approve, verify</text><text x="862" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">a person approves; the</text><text x="862" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">alerts in the graph must</text><text x="862" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">really clear</text><text x="862" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">Action · cleared_at</text><line x1="1036" y1="199" x2="1047" y2="199" stroke="#7c7c88" stroke-width="2" marker-end="url(#a)"/><rect x="1049" y="104" width="188" height="190" rx="12" fill="#141418" stroke="#26262d"/><text x="1065" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff6b4a">6</text><text x="1065" y="164" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Remember</text><text x="1065" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">root cause, lesson, the</text><text x="1065" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">fix&#x27;s track record and</text><text x="1065" y="226" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">people&#x27;s verdicts feed</text><text x="1065" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#b4b4be">the next one</text><text x="1065" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ffb347">ROOT_CAUSE · Lesson</text><path d="M1143.0 296 V318 H331.0 V300" fill="none" stroke="#7c7c88" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="437" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c7c88">precedent and learned weights change the next trace</text><rect x="34" y="354" width="1212" height="88" rx="12" fill="url(#g)" fill-opacity=".08" stroke="#ff6b4a" stroke-opacity=".45"/><text x="54" y="382" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5">One FalkorDB graph per company</text><rect x="54.0" y="400" width="69.8" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="63.0" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Service</text><rect x="130.8" y="400" width="55.0" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="139.8" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">CALLS</text><rect x="192.8" y="400" width="62.4" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="201.8" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Change</text><rect x="262.2" y="400" width="55.0" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="271.2" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Alert</text><rect x="324.2" y="400" width="77.2" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="333.2" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Incident</text><rect x="408.4" y="400" width="62.4" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="417.4" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Person</text><rect x="477.8" y="400" width="47.6" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="486.8" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Team</text><rect x="532.4" y="400" width="92.0" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="541.4" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Deployment</text><rect x="631.4" y="400" width="47.6" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="640.4" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Node</text><rect x="686.0" y="400" width="69.8" height="24" rx="12" fill="#141418" stroke="#26262d"/><text x="695.0" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4b4be">Message</text><rect x="762.8" y="400" width="92.0" height="24" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="771.8" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ff6b4a">Hypothesis</text><rect x="861.8" y="400" width="77.2" height="24" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="870.8" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ff6b4a">Evidence</text><rect x="946.0" y="400" width="84.6" height="24" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="955.0" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ff6b4a">CAUSED_BY</text><rect x="1037.6" y="400" width="69.8" height="24" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="1046.6" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ff6b4a">Episode</text><rect x="1114.4" y="400" width="47.6" height="24" rx="12" fill="#141418" stroke="#ff6b4a"/><text x="1123.4" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#ff6b4a">Turn</text><text x="34" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c7c88">orange: written by the agents as they work · the rest: the company, seeded or streamed in</text></svg>
