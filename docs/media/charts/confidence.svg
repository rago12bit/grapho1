<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-label="When it says high confidence, it is right"><rect width="760" height="222" rx="14" fill="#0b0b0e"/><rect x="1" y="1" width="758" height="220" rx="13" fill="none" stroke="#26262d"/><text x="28" y="40" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f4f4f5">When it says high confidence, it is right</text><text x="28" y="63" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#7c7c88">confidence from the gap to the runner-up, checked on the planted eval</text><text x="28" y="107" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5">says high (42 cases)</text><rect x="258" y="94" width="355" height="18" rx="4" fill="#141418"/><rect x="258" y="94" width="355.0" height="18" rx="4" fill="#ff6b4a"/><text x="623" y="107" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f4f4f5">100.0%</text><text x="28" y="135" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b4be">says medium (87 cases)</text><rect x="258" y="122" width="355" height="18" rx="4" fill="#141418"/><rect x="258" y="122" width="338.7" height="18" rx="4" fill="#3a3a44"/><text x="623" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b4b4be">95.4%</text><text x="28" y="163" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#b4b4be">says low (21 cases)</text><rect x="258" y="150" width="355" height="18" rx="4" fill="#141418"/><rect x="258" y="150" width="253.5" height="18" rx="4" fill="#3a3a44"/><text x="623" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b4b4be">71.4%</text><text x="28" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7c7c88">python -m faultline.eval</text></svg>
