<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Hypocenter: follow the alerts down to where it started, and prove the fix before anyone approves it">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6b4a" stop-opacity=".35"/><stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- the surface, the epicenter on it, and the hypocenter below with its rings -->
  <line x1="40" y1="118" x2="320" y2="118" stroke="#c9c9d1" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="180" cy="200" r="70" fill="url(#glow)"/>
  <circle cx="180" cy="200" r="26" fill="none" stroke="#ff6b4a" stroke-opacity=".9" stroke-width="2"/>
  <circle cx="180" cy="200" r="50" fill="none" stroke="#ff6b4a" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="180" cy="200" r="76" fill="none" stroke="#ff6b4a" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="180" cy="200" r="102" fill="none" stroke="#ff6b4a" stroke-opacity=".12" stroke-width="2"/>
  <line x1="180" y1="118" x2="180" y2="196" stroke="url(#g)" stroke-width="3" stroke-dasharray="4 5"/>
  <circle cx="180" cy="118" r="7" fill="#111114"/>
  <circle cx="180" cy="200" r="9" fill="url(#g)"/>
  <text x="196" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6b6b76">symptom</text>
  <text x="196" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#ff8a5c">cause</text>
  <text x="360" y="140" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="#111114">Hypocenter</text>
  <text x="364" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#g)">Follow the alerts down to where it started. Prove the fix first.</text>
  <text x="365" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#6b6b76">an on-call agent whose reasoning lives in a FalkorDB graph · Graph Hacks 2026</text>
</svg>
